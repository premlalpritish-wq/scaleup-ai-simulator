[project]
name = "msc-dissertation-2025"
version = "0.1.0"
description = "Bioprocess extraction kinetics and functional biopolymer valorisation from Saccharina latissima (MSc Dissertation 2025)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["msc_dissertation_2025"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
