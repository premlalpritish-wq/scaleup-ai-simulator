# Paid Render reference blueprint only. It is not the $0/month deployment target;
# do not provision these services for the free-hosting plan.
#
# The API service also serves the research explorer at /research/ (page plus
# /api/research/*), so the explorer needs this service only.
services:
  - type: web
    name: scaleup-ai-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: 1c-2g
    healthCheckPath: /api/health
    envVars:
      - key: SCALEUP_CORS_ORIGIN
        fromService:
          type: web
          name: scaleup-ai-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SCALEUP_MAX_CONCURRENT_RUNS
        value: "1"
      - key: SCALEUP_RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: SCALEUP_TRUST_FORWARDED_CLIENT_IP
        value: "true"
      - key: SCALEUP_MAX_BODY_BYTES
        value: "262144"
      - key: SCALEUP_RESEARCH_RETENTION
        value: "5"
      # Uncomment and mount a disk to persist researcher feedback; without it the
      # feedback endpoint reports that the message was not stored.
      # - key: SCALEUP_FEEDBACK_DIR
      #   value: /var/data/feedback
  - type: web
    name: scaleup-ai-web
    runtime: static
    rootDir: web
    buildCommand: python3 build_config.py
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: scaleup-ai-api
          envVarKey: RENDER_EXTERNAL_URL
