[project]
name = "ganjave2022-cybernetic-growth"
version = "0.1.0"
description = "Executable cybernetic growth and fed-batch model of Ganjave et al. (2022), Biotechnology Reports 33:e00694, eqs. (1)-(16)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["schemas", "models"]

[tool.setuptools.package-data]
models = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"